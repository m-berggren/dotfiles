# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Monitor configuration
# List monitors: hyprctl monitors all
# Format: monitor=<name|desc:description>, <resolution>@<hz>, <x>x<y>, <scale>
#
# Layout at home (T-shape):
#
#   [HNAY300283 1920x1080] [HNAY200986 1920x1080]
#            [eDP-1 1920x1200]
#
# Using desc: matching to handle dock port renaming across reboots
# eDP-1 is the internal display and always keeps its name
# The catch-all line handles any unknown external monitors automatically

# External monitors (identified by serial, dock-safe)
monitor=desc:Samsung Electric Company LS24D40xG HNAY300283, 1920x1080@100, 0x0, 1
monitor=desc:Samsung Electric Company LS24D40xG HNAY200986, 1920x1080@100, 1920x0, 1

# Laptop screen (centered below external monitors)
monitor=eDP-1, 1920x1200@60, 960x1080, 1

# Catch-all for unknown monitors (travel, other setups)
monitor=,preferred,auto,1

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Workspace assignments (ignored if monitor not connected)
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1

workspace = 4, monitor:desc:Samsung Electric Company LS24D40xG HNAY300283
workspace = 5, monitor:desc:Samsung Electric Company LS24D40xG HNAY300283
workspace = 6, monitor:desc:Samsung Electric Company LS24D40xG HNAY300283

workspace = 7, monitor:desc:Samsung Electric Company LS24D40xG HNAY200986
workspace = 8, monitor:desc:Samsung Electric Company LS24D40xG HNAY200986
workspace = 9, monitor:desc:Samsung Electric Company LS24D40xG HNAY200986
